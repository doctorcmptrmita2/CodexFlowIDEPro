name: CodexFlow Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./src/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Extension
        run: pnpm build

      - name: Package VSIX
        working-directory: src
        run: pnpm vsix

      - name: List bin directory
        run: ls -la bin/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: CodexFlow Agent v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: bin/codexflow-agent-${{ steps.version.outputs.version }}.vsix
          body: |
            ## CodexFlow Agent v${{ steps.version.outputs.version }}

            ### Features
            - AI-powered coding assistant
            - Multi-language support (17 languages)
            - OpenAI, Anthropic, and custom API support

            ### Installation
            1. Download the vsix file
            2. Open VS Code
            3. Press Ctrl+Shift+P then Extensions Install from VSIX
            4. Select the downloaded file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
